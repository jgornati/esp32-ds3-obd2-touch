; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3

; Waveshare ESP32-S3-Touch-LCD-3.49. PlatformIO no tiene definición para
; esta placa: se usa la devkitc-1 con lo que Waveshare indica para el
; Arduino IDE (flash 16 MB QIO 80 MHz, PSRAM OPI, USB CDC al arrancar).
[env:esp32s3]
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
; El tamaño máximo del programa sale de esta tabla (3 MB)
board_build.partitions = app3M_fat9M_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; LVGL toma la configuración de include/lv_conf.h, no del Kconfig del
    ; ESP-IDF (sin esto, sus archivos .S no compilan: buscan esp_attr.h)
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_KCONFIG_IGNORE
    -Iinclude

lib_deps =
    lvgl/lvgl @ 9.3.0

monitor_speed = 115200
; Para ver lo que se escribe en la consola
monitor_echo = yes

; LVGL y el giro de la imagen a -O2: lo demás va sin optimizar (ver optimizar.py)
extra_scripts =
    pre:optimizar.py
    post:fix_intellisense.py

; Tests de lib/obd en la PC: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
